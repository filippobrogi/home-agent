repos:
  - repo: https://github.com/astral-sh/uv-pre-commit
    # uv version.
    rev: 0.12.5
    hooks:
      - id: uv-lock
      
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.12.8
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format
  # Pytest
  - repo: local
    hooks:  
      - id: tests
        name: run tests
        entry: pytest -v tests/
        language: system
        types: [python]
        stages: [pre-push]