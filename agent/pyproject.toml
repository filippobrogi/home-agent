[project]
name = "home-agent"
version = "0.1.0"
description = "My First AI Agent"
readme = "README.md"
authors = [
    { name = "Filippo Brogi", email = "filippo.brogi@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "pydantic-ai>=2.27.0",
]

[project.scripts]
agent = "agent:main"

[build-system]
requires = ["uv_build>=0.12.3,<0.13.0"]
build-backend = "uv_build"
